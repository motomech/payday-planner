<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F4ECE3"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px)}</style></head><body>
<title>Payday Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column, phone first. Summary of this paycheck on top, then each pay period as a ledger stub. */
:root{
  /* Base colors come from the chosen theme (Settings > Colors); the rest are mixed from them. Default: Harvest, warm browns and burnt orange. */
  --bg:#F4ECE3; --surface:#FFFAF4; --ink:#2B1D14; --accent:#B4521E; --accent-ink:#FFFFFF; --bad:#A3261B; --warn:#9A6412;
  --muted:color-mix(in srgb,var(--ink) 60%,var(--bg)); --line:color-mix(in srgb,var(--ink) 14%,var(--bg));
  --accent-soft:color-mix(in srgb,var(--accent) 16%,var(--surface));
  --bad-soft:color-mix(in srgb,var(--bad) 14%,var(--surface)); --warn-soft:color-mix(in srgb,var(--warn) 16%,var(--surface));
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1410; --surface:#261C16; --ink:#F1E6DC; --accent:#E58A4E; --accent-ink:#2A1305; --bad:#F08A7A; --warn:#E0B060; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1410; --surface:#261C16; --ink:#F1E6DC; --accent:#E58A4E; --accent-ink:#2A1305; --bad:#F08A7A; --warn:#E0B060; color-scheme:dark}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.swatch{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--body);cursor:pointer;text-align:left}
.swatch[aria-pressed="true"]{border-color:var(--accent)}
.swatch .chips{display:flex;gap:4px}
.swatch .chips i{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--surface);color:var(--ink);border:0;padding:8px 14px;font:600 13px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pickers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pickers label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.pickers input[type=color]{width:44px;height:36px;padding:2px;border-radius:8px;flex:none}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:18px}
header.top h1{font-size:22px;font-weight:800}
.save-state{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--accent)} .dot.busy{background:var(--warn)} .dot.bad{background:var(--bad)}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{background:none;border:0;color:var(--muted);font:600 13px var(--body);padding:10px 4px;border-radius:10px;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}

/* hero summary */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.hero .label{color:inherit;opacity:.8}
.hero .big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1}
.hero .row{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px}
.hero .row b{font-family:var(--mono);font-weight:500}

/* period stub */
.period{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.period.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.p-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 16px 10px;flex-wrap:wrap}
.p-head h2{font-size:18px;font-weight:600}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);vertical-align:middle}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.lines{list-style:none;margin:0;padding:0 16px;display:flex;flex-direction:column}
.lines li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px dashed var(--line)}
.lines li.inc .amt{color:var(--accent)}
.lines li.paid .nm{text-decoration:line-through;color:var(--muted)}
.lines .nm{min-width:0;overflow-wrap:anywhere}
.lines .sub{font-size:12px;color:var(--muted)}
.lines input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);margin:0}
.lines .ico{width:22px;text-align:center;color:var(--accent);font-weight:700}
.amtbtn{background:none;border:0;padding:4px 0;font:inherit;font-family:var(--mono);color:inherit;cursor:pointer;text-decoration:underline dotted var(--muted);text-underline-offset:4px;text-align:right}
.amtbtn .was{display:block;font-family:var(--body);font-size:11px;color:var(--muted);text-decoration:none}
.amt-edit{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:2px 0 4px 32px}
.amt-edit input{width:9em;flex:0 1 auto;font-family:var(--mono)}
.amt-edit span{font-size:13px;color:var(--muted)}
.p-foot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px 14px;border-top:1px solid var(--line);margin-top:4px;background:color-mix(in srgb,var(--bg) 50%,var(--surface))}
.p-foot div{display:flex;flex-direction:column;gap:2px}
.p-foot .num{font-size:15px}
.neg{color:var(--bad)} .pos{color:var(--accent)}
.pager{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}

/* forms & lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{font-family:var(--mono);font-size:13px;min-height:120px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.b{font:600 14px var(--body);border-radius:10px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.b.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.b.danger{color:var(--bad);border-color:var(--bad)}
.b.small{padding:6px 10px;font-size:13px}
.b:disabled{opacity:.5;cursor:default}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.items li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.items li:first-child{border-top:0}
.items .meta{font-size:13px;color:var(--muted)}
.items .acts{display:flex;gap:6px;grid-column:2;grid-row:1 / span 2}
.empty{padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.note{font-size:13px;color:var(--muted)}
.msg{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink)}
.msg.bad{background:var(--bad-soft)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--muted)}
td.err{color:var(--bad);white-space:normal}
code{font-family:var(--mono);font-size:12.5px;background:var(--bg);padding:1px 5px;border-radius:5px}
@media (prefers-reduced-motion:no-preference){.period,.card{animation:in .25s ease both}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

<div class="wrap">
  <header class="top">
    <h1>Payday Planner</h1>
    <div class="save-state" id="saveState"><span class="dot" id="saveDot"></span><span id="saveText">Loading…</span></div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" role="tablist" id="tabs">
  <button role="tab" data-tab="periods" aria-selected="true">Paychecks</button>
  <button role="tab" data-tab="bills" aria-selected="false">Bills</button>
  <button role="tab" data-tab="income" aria-selected="false">Income</button>
  <button role="tab" data-tab="backup" aria-selected="false">Settings</button>
</nav>

<script>
(function(){
"use strict";
/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const dayNum=d=>Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
const dim=(y,m)=>new Date(y,m+1,0).getDate();
function monthDate(y,m,day){y+=Math.floor(m/12);m=((m%12)+12)%12;return new Date(y,m,Math.min(day,dim(y,m)))}
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const fmtShort=d=>d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
const fmtDay=d=>d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
const money=n=>(n<0?"-":"")+"$"+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

const FREQS={once:"One time",weekly:"Weekly",biweekly:"Every 2 weeks",semimonthly:"Twice a month",monthly:"Monthly",quarterly:"Every 3 months",yearly:"Yearly"};

/* All dates an item lands on in [s, e). */
function occurrences(it,s,e){
  const a=parseISO(it.date),out=[],f=it.freq;
  if(isNaN(a))return out;
  if(f==="once"){if(a>=s&&a<e)out.push(a);return out}
  if(f==="weekly"||f==="biweekly"){
    const step=f==="weekly"?7:14;
    let k=Math.floor((dayNum(s)-dayNum(a))/step);
    for(let d=addDays(a,k*step);d<e;k++,d=addDays(a,k*step))if(d>=s)out.push(d);
    return out;
  }
  if(f==="semimonthly"){
    const d1=a.getDate(),d2=Number(it.day2)||(d1<=15?d1+15:d1-15);
    for(let y=s.getFullYear(),m=s.getMonth()-1;;m++){
      const first=monthDate(y,m,1);if(first>=e)break;
      for(const dd of [d1,d2]){const d=monthDate(y,m,dd);if(d>=s&&d<e)out.push(d)}
    }
    return out.sort((x,y)=>x-y);
  }
  const step=f==="quarterly"?3:f==="yearly"?12:1;
  const mi=(s.getFullYear()*12+s.getMonth())-(a.getFullYear()*12+a.getMonth());
  for(let k=Math.floor(mi/step)-1;;k++){
    const d=monthDate(a.getFullYear(),a.getMonth()+k*step,a.getDate());
    if(d>=e)break; if(d>=s)out.push(d);
  }
  return out;
}

/* ---------- colors ---------- */
const THEMES={
  harvest:{name:"Harvest",light:{bg:"#F4ECE3",surface:"#FFFAF4",ink:"#2B1D14",accent:"#B4521E",bad:"#A3261B",warn:"#9A6412"},dark:{bg:"#1B1410",surface:"#261C16",ink:"#F1E6DC",accent:"#E58A4E",bad:"#F08A7A",warn:"#E0B060"}},
  coffee:{name:"Coffee",light:{bg:"#EEE6DD",surface:"#FAF6F1",ink:"#2A2019",accent:"#7A4E2D",bad:"#A3261B",warn:"#8C6414"},dark:{bg:"#16110D",surface:"#211913",ink:"#EDE3D9",accent:"#C99A6B",bad:"#F08A7A",warn:"#D9AE62"}},
  canyon:{name:"Canyon",light:{bg:"#F5EAE5",surface:"#FFF8F5",ink:"#2A1512",accent:"#A0302A",bad:"#8E1F18",warn:"#A0620E"},dark:{bg:"#1B110F",surface:"#271917",ink:"#F2E3DF",accent:"#E2685C",bad:"#FF9C8E",warn:"#E3B062"}},
  sunset:{name:"Sunset",light:{bg:"#FBF0E4",surface:"#FFFBF6",ink:"#2E1C0E",accent:"#D2691E",bad:"#B3261E",warn:"#8F5E0A"},dark:{bg:"#1D140C",surface:"#2A1D12",ink:"#F6E8D9",accent:"#F29A4A",bad:"#F4907F",warn:"#E8B867"}},
  pine:{name:"Pine",light:{bg:"#EEF3F1",surface:"#FFFFFF",ink:"#13201C",accent:"#1E6B57",bad:"#B3392F",warn:"#9A6412"},dark:{bg:"#0E1513",surface:"#16201D",ink:"#E4EDEA",accent:"#5CC3A3",bad:"#F08B80",warn:"#E3B062"}},
  slate:{name:"Slate",light:{bg:"#EDF0F4",surface:"#FFFFFF",ink:"#172029",accent:"#2F5E8C",bad:"#B3392F",warn:"#9A6412"},dark:{bg:"#0F141A",surface:"#18202A",ink:"#E3E9F0",accent:"#7FB0E0",bad:"#F08B80",warn:"#E3B062"}}
};
const DEFAULT_THEME={preset:"harvest",mode:"auto",custom:{bg:"#F4ECE3",surface:"#FFFAF4",ink:"#2B1D14",accent:"#B4521E"}};
function lum(hex){const n=parseInt(hex.slice(1),16),c=[n>>16,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
const darkMQ=window.matchMedia?matchMedia("(prefers-color-scheme: dark)"):null;
function themeSettings(){const t=state.theme||{};return {preset:THEMES[t.preset]||t.preset==="custom"?t.preset:DEFAULT_THEME.preset,mode:["auto","light","dark"].includes(t.mode)?t.mode:"auto",custom:{...DEFAULT_THEME.custom,...(t.custom||{})},lastPreset:THEMES[t.lastPreset]?t.lastPreset:null}}
function applyTheme(){
  const t=themeSettings();let pal,dark;
  if(t.preset==="custom"){pal={...t.custom,bad:"",warn:""};dark=lum(pal.bg)<.2}
  else{const host=document.documentElement.getAttribute("data-theme");dark=t.mode==="dark"||(t.mode==="auto"&&(host?host==="dark":!!(darkMQ&&darkMQ.matches)));pal=THEMES[t.preset][dark?"dark":"light"]}
  const r=document.documentElement.style;
  r.setProperty("--bg",pal.bg);r.setProperty("--surface",pal.surface);r.setProperty("--ink",pal.ink);r.setProperty("--accent",pal.accent);
  const L=lum(pal.accent);r.setProperty("--accent-ink",(L+.05)/.057>1.05/(L+.05)?"#1A120C":"#FFFFFF");
  r.setProperty("--bad",pal.bad||(dark?"#F08A7A":"#A3261B"));r.setProperty("--warn",pal.warn||(dark?"#E0B060":"#9A6412"));
  r.setProperty("color-scheme",dark?"dark":"light");
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",pal.bg);
}
if(darkMQ&&darkMQ.addEventListener)darkMQ.addEventListener("change",applyTheme);
function colorsCardHTML(){
  const t=themeSettings();
  const sw=Object.entries(THEMES).map(([k,v])=>{const p=v.light;return `<button type="button" class="swatch" data-act="theme" data-k="${k}" aria-pressed="${t.preset===k}"><span class="chips"><i style="background:${p.bg}"></i><i style="background:${p.accent}"></i><i style="background:${v.dark.accent}"></i><i style="background:${p.ink}"></i></span>${v.name}${k==="harvest"?" (default)":""}</button>`}).join("")
    +`<button type="button" class="swatch" data-act="theme" data-k="custom" aria-pressed="${t.preset==="custom"}"><span class="chips"><i style="background:${t.custom.bg}"></i><i style="background:${t.custom.accent}"></i><i style="background:${t.custom.surface}"></i><i style="background:${t.custom.ink}"></i></span>My own colors</button>`;
  const modes=t.preset==="custom"?"":`<div><div class="label" style="margin-bottom:6px">Light or dark</div><div class="seg" role="group" aria-label="Light or dark">${[["auto","Match phone"],["light","Light"],["dark","Dark"]].map(([k,l])=>`<button type="button" data-act="tmode" data-k="${k}" aria-pressed="${t.mode===k}">${l}</button>`).join("")}</div></div>`;
  const pick=t.preset!=="custom"?"":`<div class="pickers">${[["bg","Background"],["surface","Cards"],["ink","Text"],["accent","Highlight"]].map(([k,l])=>`<label for="tc-${k}"><input type="color" id="tc-${k}" data-tc="${k}" value="${t.custom[k]}">${l}</label>`).join("")}</div><p class="note" style="margin:0">Pick a dark background for a dark look. Buttons, lines and labels are mixed from these four colors.</p>`;
  return `<div class="card"><h3 style="font-size:17px">Colors</h3><div class="swatches">${sw}</div>${modes}${pick}</div>`;
}

/* ---------- state ---------- */
const LS_KEY="payday-planner-v1";
let state={bills:[],incomes:[],paid:{},amounts:{},mainIncomeId:null,updatedAt:0};
let ui={tab:"periods",offset:0,editAmt:null,editBill:null,editIncome:null,confirmDel:null,importRows:null,flash:null};
const uid=()=>Math.random().toString(36).slice(2,10);

function normalize(s){
  if(!s||typeof s!=="object")return null;
  const clean=(arr)=>Array.isArray(arr)?arr.filter(x=>x&&x.name!=null&&x.date).map(x=>({id:String(x.id||uid()),name:String(x.name),amount:Number(x.amount)||0,freq:FREQS[x.freq]?x.freq:"monthly",date:String(x.date),day2:x.day2?Number(x.day2):null,grace:Number(x.grace)>0?Math.round(Number(x.grace)):null})):[];
  return {bills:clean(s.bills),incomes:clean(s.incomes),paid:(s.paid&&typeof s.paid==="object")?s.paid:{},amounts:(s.amounts&&typeof s.amounts==="object")?s.amounts:{},moved:(s.moved&&typeof s.moved==="object")?s.moved:{},mainIncomeId:s.mainIncomeId||null,updatedAt:Number(s.updatedAt)||0,lastBackup:Number(s.lastBackup)||null,theme:(s.theme&&typeof s.theme==="object")?s.theme:null};
}

/* storage: account db when running inside Claude, plus device copy always */
let dbRef=null,saveChain=Promise.resolve(),saveTimer=null;
function setSave(kind,text){document.getElementById("saveDot").className="dot "+kind;document.getElementById("saveText").textContent=text}
function localLoad(){try{return normalize(JSON.parse(localStorage.getItem(LS_KEY)))}catch(e){return null}}
function localSave(){try{localStorage.setItem(LS_KEY,JSON.stringify(state));return true}catch(e){return false}}
function commit(){
  state.updatedAt=Date.now();
  const ok=localSave();
  render();
  if(dbRef){
    setSave("busy","Saving…");
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{
      const body={json:JSON.stringify(state),updatedAt:state.updatedAt};
      saveChain=saveChain.then(()=>dbRef.set(body)).then(()=>setSave("ok","Saved to your account"),()=>setSave("bad",ok?"Saved on this phone only":"Not saved"));
    },500);
  } else setSave(ok?"ok":"bad",ok?"Saved on this phone":"Not saved: storage is blocked");
  driveSchedule();
}
async function initStore(){
  const local=localLoad(); if(local)state=local;
  render();
  setSave(local?"ok":"", local?"Saved on this phone":"Nothing saved yet");
  if(!(window.claude&&window.claude.use))return;
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user)return;
    const id=await user.id(); if(!id)return;
    const ref=db.doc(`data/users/${id}/budget`);
    const snap=await ref.get();
    dbRef=ref;
    const remote=snap.exists?normalize(JSON.parse(snap.data().json||"null")):null;
    if(remote&&remote.updatedAt>=state.updatedAt){state=remote;localSave();render();setSave("ok","Saved to your account")}
    else if(state.bills.length||state.incomes.length){commit()}
    else setSave("ok","Saves to your account");
  }catch(e){/* keep device copy */}
}

/* ---------- pay periods ---------- */
function mainIncome(){return state.incomes.find(i=>i.id===state.mainIncomeId)||state.incomes[0]||null}
function amtFor(key,normal){const v=state.amounts&&state.amounts[key];return typeof v==="number"&&isFinite(v)?v:normal}
// Amount on a pay-period line: tap to change it for that one date only.
function amtCell(key,amt,normal,label){
  const changed=amt!==normal;
  return `<button type="button" class="amt amtbtn" data-act="amt" data-key="${esc(key)}" aria-label="Change amount for ${esc(label)}">${money(amt)}${changed?`<span class="was">usually ${money(normal)}</span>`:""}</button>`;
}
function amtEditor(key,amt,normal,paid,isInc){
  if(ui.editAmt!==key)return "";
  return `<form class="amt-edit" data-amtkey="${esc(key)}" data-normal="${normal}"><span>${isInc?"Amount received":paid?"Amount paid":"Amount due"}</span><input id="amt-${esc(key)}" name="amt" inputmode="decimal" value="${amt.toFixed(2)}" aria-label="Amount"><button class="b small primary" type="submit">Save</button>${amt!==normal?`<button class="b small" type="button" data-act="amtreset" data-key="${esc(key)}">Use usual ${money(normal)}</button>`:`<button class="b small" type="button" data-act="amtclose">Done</button>`}</form>`;
}
function periods(offset,count){
  const mi=mainIncome(); if(!mi)return [];
  const t=today();
  const pays=occurrences(mi,addDays(t,-800),addDays(t,800));
  let cur=-1; for(let i=0;i<pays.length;i++)if(pays[i]<=t)cur=i;
  if(cur<0)cur=0;
  const out=[];
  for(let i=cur+offset;i<cur+offset+count;i++){
    if(i<0||i+1>=pays.length)continue;
    const s=pays[i],e=pays[i+1],prev=i>0?pays[i-1]:null;
    // A bill with a grace period can be moved to the next check when that payday is still within its grace.
    const graceOk=(b,d,nextPay)=>b.grace&&nextPay&&nextPay<=addDays(d,b.grace);
    const isMoved=(b,d,nextPay)=>!!(state.moved&&state.moved[b.id+"|"+iso(d)])&&graceOk(b,d,nextPay);
    const bills=[];
    for(const b of state.bills){
      for(const d of occurrences(b,s,e)){const key=b.id+"|"+iso(d);if(isMoved(b,d,e))continue;bills.push({b,d,key,amt:amtFor(key,b.amount),canMove:graceOk(b,d,e)})}
      if(prev)for(const d of occurrences(b,prev,s)){if(!isMoved(b,d,s))continue;const key=b.id+"|"+iso(d);bills.push({b,d,key,amt:amtFor(key,b.amount),movedFrom:prev})}
    }
    bills.sort((x,y)=>x.d-y.d||y.b.amount-x.b.amount);
    const inc=[];for(const n of state.incomes)for(const d of occurrences(n,s,e)){const key=n.id+"|"+iso(d);inc.push({n,d,key,amt:amtFor(key,n.amount)})}
    inc.sort((x,y)=>x.d-y.d);
    const incT=inc.reduce((a,x)=>a+x.amt,0),billT=bills.reduce((a,x)=>a+x.amt,0);
    const unpaid=bills.filter(x=>!state.paid[x.key]).reduce((a,x)=>a+x.amt,0);
    out.push({rel:i-cur,s,e,bills,inc,incT,billT,unpaid,left:incT-billT,current:s<=t&&t<e});
  }
  return out;
}

function graceRow(x,p,byRel){

/* ---------- CSV ---------- */
function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true; else if(c===","||c==="\t"){row.push(f);f=""} else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""} else f+=c}
  row.push(f);rows.push(row);
  return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x));
}
function normFreq(s,fallback){
  s=(s||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
  if(!s)return fallback;
  if(/^(once|one ?time|single)/.test(s))return "once";
  if(/(bi ?weekly|every (2|two|other) weeks?|fortnight)/.test(s))return "biweekly";
  if(/(semi ?monthly|twice a month|2x month|1st and 15th)/.test(s))return "semimonthly";
  if(/week/.test(s))return "weekly";
  if(/(quarter|every (3|three) months)/.test(s))return "quarterly";
  if(/(year|annual)/.test(s))return "yearly";
  if(/month/.test(s))return "monthly";
  return null;
}
function normDate(s){
  s=(s||"").trim();const t=today();
  let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))return iso(new Date(+m[1],m[2]-1,+m[3]));
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/))){let y=+m[3];if(y<100)y+=2000;const d=new Date(y,m[1]-1,+m[2]);return isNaN(d)?null:iso(d)}
  if((m=s.match(/^(\d{1,2})(st|nd|rd|th)?$/))){const day=+m[1];if(day<1||day>31)return null;let d=monthDate(t.getFullYear(),t.getMonth(),day);if(d<t)d=monthDate(t.getFullYear(),t.getMonth()+1,day);return iso(d)}
  const d=new Date(s);if(!isNaN(d)&&/[a-z]/i.test(s))return iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()));
  return null;
}
function rowsFromCSV(text){
  let rows=parseCSV(text);if(!rows.length)return [];
  let start=0;const h=rows[0].map(x=>x.toLowerCase());
  let col={type:0,name:1,amount:2,freq:3,date:4};
  if(h.some(x=>/name|amount|type/.test(x))){start=1;
    const find=re=>h.findIndex(x=>re.test(x));
    col={type:find(/type|kind/),name:find(/name|bill|payee|desc/),amount:find(/amount|amt|\$|cost|pay$/),freq:find(/often|freq|repeat|recur|schedule/),date:find(/date|due|day|payday/)};
    if(col.name<0)col.name=col.type===0?1:0;
  }
  const out=[];
  for(let i=start;i<rows.length;i++){const r=rows[i],get=k=>col[k]>=0?(r[col[k]]||""):"";
    const typeRaw=get("type").toLowerCase();
    const type=/inc|pay|salary|wage|deposit/.test(typeRaw)?"income":"bill";
    const name=get("name"),amount=parseFloat(get("amount").replace(/[$,\s]/g,""));
    const freq=normFreq(get("freq"),type==="income"?"biweekly":"monthly");
    const date=normDate(get("date"));
    let err=null;
    if(!name)err="missing a name";else if(!isFinite(amount))err=`"${get("amount")}" isn't an amount`;else if(!freq)err=`"${get("freq")}" isn't a schedule I know (try monthly, weekly, every 2 weeks)`;else if(!date)err=`"${get("date")}" isn't a date (try 11/1/2026 or 15)`;
    out.push({line:i+1,type,name,amount:Math.abs(amount),freq,date,err});
  }
  return out;
}
function toCSV(){
  const q=s=>/[",\n]/.test(s)?`"${String(s).replace(/"/g,'""')}"`:String(s);
  const lines=["type,name,amount,how often,date,second day"];
  for(const n of state.incomes)lines.push(["income",n.name,n.amount.toFixed(2),n.freq,n.date,n.day2||""].map(q).join(","));
  for(const b of state.bills)lines.push(["bill",b.name,b.amount.toFixed(2),b.freq,b.date,b.day2||""].map(q).join(","));
  return lines.join("\n")+"\n";
}

    const tc=google.accounts.oauth2.initTokenClient({client_id:drive.cfg.clientId,scope:"https://www.googleapis.com/auth/drive.file",
      callback:r=>{if(r.error)return rej(new Error(r.error_description||r.error));drive.token=r.access_token;drive.exp=Date.now()+(Number(r.expires_in)||3600)*1000-60000;res()},
      error_callback:e=>rej(new Error(e&&e.type==="popup_closed"?"Google sign-in was closed.":"Google sign-in didn't finish."))});
    tc.requestAccessToken({prompt:first?"consent":""});
  });
}
const tokenOk=()=>drive.token&&Date.now()<drive.exp;
async function gapi(url,opts={}){
  const r=await fetch(url,{...opts,headers:{Authorization:"Bearer "+drive.token,...(opts.headers||{})}});
  if(r.status===401){drive.token=null;throw new Error("Google sign-in expired.")}
  if(!r.ok)throw new Error("Google Drive said: "+r.status);
  return r;
}
async function driveFind(q){const r=await gapi("https://www.googleapis.com/drive/v3/files?spaces=drive&fields=files(id,modifiedTime)&orderBy=modifiedTime desc&q="+encodeURIComponent(q+" and trashed=false"));return (await r.json()).files[0]||null}
async function driveFolder(){
  if(drive.cfg.folderId)return drive.cfg.folderId;
  let f=await driveFind(`name='${FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder'`);
  if(!f){const r=await gapi("https://www.googleapis.com/drive/v3/files?fields=id",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:FOLDER_NAME,mimeType:"application/vnd.google-apps.folder"})});f=await r.json()}
  drive.cfg.folderId=f.id;driveSaveCfg();return f.id;
}
async function driveFile(){
  if(drive.cfg.fileId)return drive.cfg.fileId;
  const folder=await driveFolder();
  const f=await driveFind(`name='${FILE_NAME}' and '${folder}' in parents`);
  if(f){drive.cfg.fileId=f.id;driveSaveCfg()}
  return f?f.id:null;
}
const backupJSON=()=>JSON.stringify({app:"payday-planner",version:1,savedAt:new Date().toISOString(),data:state},null,1);
async function driveUpload(){
  const body=backupJSON();let id=await driveFile();
  if(id){
    try{await gapi(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:"PATCH",headers:{"Content-Type":"application/json"},body});}
    catch(e){if(!/404/.test(e.message))throw e;drive.cfg.fileId=null;drive.cfg.folderId=null;id=null}
  }
  if(!id){
    const folder=await driveFolder(),b="pp"+uid();
    const multi=`--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify({name:FILE_NAME,parents:[folder]})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
    const r=await gapi("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+b},body:multi});
    drive.cfg.fileId=(await r.json()).id;
  }
  drive.cfg.lastSync=Date.now();drive.cfg.pending=false;driveSaveCfg();
}
async function driveSync(fromTap){
  if(!drive.available||!drive.cfg.connected||drive.busy)return;
  drive.busy=true;drive.status="Backing up to Drive…";renderDriveCard();
  try{
    if(!tokenOk()){if(!fromTap){drive.cfg.pending=true;driveSaveCfg();drive.status="";return}await driveSignIn(false)}
    await driveUpload();drive.status="";
  }catch(e){drive.cfg.pending=true;driveSaveCfg();drive.status=e.message}
  finally{drive.busy=false;renderDriveCard()}
}
function driveSchedule(){if(!drive.available||!drive.cfg.connected)return;drive.cfg.pending=true;driveSaveCfg();clearTimeout(drive.timer);drive.timer=setTimeout(()=>driveSync(false),4000)}
async function driveConnect(){
  const id=(document.getElementById("driveClientId")||{}).value;
  if(id!==undefined&&id.trim()){drive.cfg.clientId=id.trim();driveSaveCfg()}
  if(!/\.apps\.googleusercontent\.com$/.test(drive.cfg.clientId||"")){drive.status="Paste the Client ID from Google first. It ends in .apps.googleusercontent.com.";renderDriveCard();return}
  drive.busy=true;drive.status="Connecting…";renderDriveCard();
  try{
    await driveSignIn(true);
    await driveFolder();
    const existing=await driveFile();
    drive.cfg.connected=true;driveSaveCfg();
    if(existing&&!(state.bills.length||state.incomes.length)){drive.busy=false;drive.status="";await driveRestore(true);return}
    await driveUpload();drive.status="";
    flash(`Connected. Backups now save to the "${FOLDER_NAME}" folder in your Drive.`);
  }catch(e){drive.status=e.message}
  finally{drive.busy=false;renderDriveCard()}
}
async function driveRestore(silentOk){
  drive.busy=true;drive.status="Restoring from Drive…";renderDriveCard();
  try{
    if(!tokenOk())await driveSignIn(false);
    const id=await driveFile();if(!id)throw new Error("There's no backup in your Drive folder yet.");
    const r=await gapi(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
    const j=await r.json();const s=normalize(j.data||j);if(!s)throw new Error("The Drive backup couldn't be read.");
    state=s;ui.offset=0;ui.confirmDel=null;localSave();render();
    flash(`Restored ${s.bills.length} bills and ${s.incomes.length} income${s.incomes.length===1?"":"s"} from Drive.`);drive.status="";
  }catch(e){drive.status=e.message}
  finally{drive.busy=false;renderDriveCard()}
}
function driveDisconnect(){
  try{if(drive.token&&window.google)google.accounts.oauth2.revoke(drive.token,()=>{})}catch(e){}
  drive.token=null;drive.cfg={clientId:drive.cfg.clientId||DRIVE_CLIENT_ID};driveSaveCfg();ui.confirmDel=null;render();
}
function driveCardHTML(){
  if(!drive.available)return "";
  const c=drive.cfg,when=c.lastSync?new Date(c.lastSync).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):null;
  const st=drive.status?`<p class="note" style="margin:0;color:${/…$/.test(drive.status)?"var(--muted)":"var(--bad)"}">${esc(drive.status)}</p>`:"";
  if(!c.connected)return `<div class="card" id="driveCard"><h3 style="font-size:17px">Automatic Google Drive backup</h3>
    <p class="note" style="margin:0">Connect once and the app saves a backup to the <b>${FOLDER_NAME}</b> folder in your Drive every time you change something. No menus, same folder every time.</p>
    ${c.clientId?"":`<label class="f" for="driveClientId">Google Client ID<input id="driveClientId" value="" placeholder="1234-abc.apps.googleusercontent.com" autocomplete="off" spellcheck="false"></label>`}
    <div class="btns"><button class="b primary" data-act="dconnect" ${drive.busy?"disabled":""}>Connect Google Drive</button></div>${st}</div>`;
  return `<div class="card" id="driveCard"><h3 style="font-size:17px">Automatic Google Drive backup <span class="chip">On</span></h3>
    <p class="note" style="margin:0">Saving to the <b>${FOLDER_NAME}</b> folder in your Drive. ${c.pending?"<b>Changes waiting to back up.</b>":when?`Last backup ${when}.`:""}</p>
    <div class="btns"><button class="b primary" data-act="dsync" ${drive.busy?"disabled":""}>${c.pending?"Back up now":"Back up again"}</button><button class="b" data-act="drestore" ${drive.busy?"disabled":""}>Restore from Drive</button>${ui.confirmDel==="DRIVE"?`<button class="b small danger" data-act="ddisc">Disconnect</button>`:`<button class="b small" data-act="askdel" data-id="DRIVE">Disconnect</button>`}</div>${st}</div>`;
}
function renderDriveCard(){const el=document.getElementById("driveCard");if(el)el.outerHTML=driveCardHTML();renderDriveBanner()}
function renderDriveBanner(){
  let el=document.getElementById("driveBanner");
  const show=drive.available&&drive.cfg.connected&&drive.cfg.pending&&!drive.busy&&!tokenOk()&&ui.tab!=="backup";
  if(!show){if(el)el.remove();return}
  if(!el){el=document.createElement("button");el.id="driveBanner";el.className="b small";el.dataset.act="dsync";el.style.cssText="position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:21;box-shadow:0 2px 10px rgba(0,0,0,.15)";document.body.appendChild(el)}
  el.textContent="Back up to Drive";
}

/* ---------- files out ---------- */
async function giveFile(filename,text,mime){
  // Inside Claude: the downloads capability. Installed app: Android share sheet (pick Drive), else a normal download.
  if(window.claude&&window.claude.use){
    try{const dl=await window.claude.use("downloads");if(dl){await dl.save({filename,data:new Blob([text],{type:mime})});return "saved"}}catch(e){if(e&&e.code==="declined")return "declined"}
  }
  try{
    const file=new File([text],filename,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return "shared"}
  }catch(e){if(e&&e.name==="AbortError")return "declined"}
  try{const url=URL.createObjectURL(new Blob([text],{type:mime}));const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return "saved"}catch(e){return "failed"}
}
function flash(text,bad){ui.flash={text,bad};render();clearTimeout(flash.t);flash.t=setTimeout(()=>{ui.flash=null;render()},5000)}

/* ---------- events ---------- */
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(!b)return;ui.tab=b.dataset.tab;ui.confirmDel=null;ui.flash=null;render();window.scrollTo(0,0)});

document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");if(!el||el.tagName==="INPUT")return;
  const a=el.dataset.act;
  if(a==="go"){ui.tab=el.dataset.tab;render()}
  else if(a==="off"){const d=+el.dataset.d;ui.offset=d===0?0:ui.offset+d;render()}
  else if(a==="sample"){loadSample()}
  else if(a==="theme"){const k=el.dataset.k,th=themeSettings();state.theme={...th,preset:k,lastPreset:THEMES[k]?k:(THEMES[th.preset]?th.preset:th.lastPreset)};commit()}
  else if(a==="tmode"){state.theme={...themeSettings(),mode:el.dataset.k};commit()}
  else if(a==="amt"){ui.editAmt=ui.editAmt===el.dataset.key?null:el.dataset.key;render();focusAmt()}
  else if(a==="move"){state.moved=state.moved||{};state.moved[el.dataset.key]=true;commit()}
  else if(a==="unmove"){if(state.moved)delete state.moved[el.dataset.key];commit()}
  else if(a==="amtclose"){ui.editAmt=null;render()}
  else if(a==="amtreset"){delete state.amounts[el.dataset.key];ui.editAmt=null;commit()}
  else if(a==="dconnect"){driveConnect()}
  else if(a==="dsync"){driveSync(true)}
  else if(a==="drestore"){driveRestore()}
  else if(a==="ddisc"){driveDisconnect()}
  else if(a==="edit"){if(el.dataset.kind==="income")ui.editIncome=el.dataset.id;else ui.editBill=el.dataset.id;render();window.scrollTo(0,0)}
  else if(a==="cancel"){ui.editBill=ui.editIncome=null;render()}
  else if(a==="askdel"){ui.confirmDel=el.dataset.id;render()}
  else if(a==="nodel"){ui.confirmDel=null;render()}
  else if(a==="del"){const k=el.dataset.kind==="income"?"incomes":"bills";state[k]=state[k].filter(x=>x.id!==el.dataset.id);if(state.mainIncomeId===el.dataset.id)state.mainIncomeId=null;ui.confirmDel=null;commit()}
  else if(a==="wipe"){state={bills:[],incomes:[],paid:{},amounts:{},mainIncomeId:null,updatedAt:0};ui.confirmDel=null;commit();flash("All data erased.")}
  else if(a==="parse"){ui.csvText=document.getElementById("csvText").value;const rows=rowsFromCSV(ui.csvText);if(!rows.length)flash("Paste a list or choose a CSV file first.",true);else{ui.importRows=rows;render()}}
  else if(a==="cancelimport"){ui.importRows=null;render()}
  else if(a==="doimport"){const good=ui.importRows.filter(r=>!r.err);for(const r of good){const it={id:uid(),name:r.name,amount:r.amount,freq:r.freq,date:r.date,day2:null};(r.type==="income"?state.incomes:state.bills).push(it)}ui.importRows=null;ui.csvText="";commit();flash(`Added ${good.length} item${good.length===1?"":"s"}.`)}
  else if(a==="export"){const r=await giveFile("payday-planner.csv",toCSV(),"text/csv");if(r==="failed")flash("Couldn't save the file on this device.",true)}
  else if(a==="backup"){
    const stamp=iso(today());
    // Android only shares a short list of file types, so the backup goes out as plain text (.txt); Restore reads it either way.
    const r=await giveFile(`payday-planner-backup-${stamp}.txt`,backupJSON(),"text/plain");
    if(r==="shared"||r==="saved"){state.lastBackup=Date.now();commit();flash(r==="shared"?"Backup file sent. If you picked Drive, it's in your Drive now.":"Backup saved to your phone's Downloads. To put it in Google Drive, open the Drive app, tap +, then Upload, and pick the payday-planner-backup file.")}
    else if(r==="failed")flash("Couldn't make the backup file on this device.",true);
  }
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.tc){const th=themeSettings();th.custom[t.dataset.tc]=t.value;state.theme=th;commit();return}
  if(t.dataset&&t.dataset.act==="paid"){if(t.checked){state.paid[t.dataset.key]=true;ui.editAmt=t.dataset.key}else{delete state.paid[t.dataset.key];if(ui.editAmt===t.dataset.key)ui.editAmt=null}commit();focusAmt();return}
  if(t.name==="freq"){const f=t.closest("form").querySelector("[data-day2]");if(f)f.hidden=t.value!=="semimonthly";return}
  if(t.id==="csvFile"&&t.files[0]){const text=await t.files[0].text();ui.csvText=text;ui.importRows=rowsFromCSV(text);render();return}
  if(t.id==="restoreFile"&&t.files[0]){
    try{const j=JSON.parse(await t.files[0].text());const s=normalize(j.data||j);if(!s)throw 0;state=s;ui.offset=0;commit();flash(`Restored ${s.bills.length} bills and ${s.incomes.length} income${s.incomes.length===1?"":"s"}.`)}
    catch(err){flash("That file isn't a Payday Planner backup. Pick the file that starts with payday-planner-backup.",true)}
  }
});
function focusAmt(){const i=ui.editAmt&&document.getElementById("amt-"+ui.editAmt);if(i){i.focus();i.select()}}
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.dataset.amtkey){
    const v=parseFloat(String(new FormData(f).get("amt")).replace(/[$,\s]/g,""));
    if(!isFinite(v)){flash("Enter the amount as a number, like 84.99.",true);return}
    const key=f.dataset.amtkey,normal=Number(f.dataset.normal),amt=Math.round(Math.abs(v)*100)/100;
    state.amounts=state.amounts||{};
    if(amt===normal)delete state.amounts[key];else state.amounts[key]=amt;
    ui.editAmt=null;commit();return;
  }
  const kind=f.dataset.kind,isInc=kind==="income";
  const fd=new FormData(f);const amount=parseFloat(String(fd.get("amount")).replace(/[$,\s]/g,""));
  if(!isFinite(amount)){flash("Enter the amount as a number, like 1200 or 84.99.",true);return}
  const it={name:String(fd.get("name")).trim(),amount:Math.abs(amount),freq:String(fd.get("freq")),date:String(fd.get("date")),day2:fd.get("freq")==="semimonthly"&&fd.get("day2")?Number(fd.get("day2")):null};
  if(!isInc)it.grace=Number(fd.get("grace"))>0?Math.round(Number(fd.get("grace"))):null;
  const arr=isInc?state.incomes:state.bills;const editId=isInc?ui.editIncome:ui.editBill;
  let id;
  if(editId){const x=arr.find(z=>z.id===editId);Object.assign(x,it);id=editId}else{id=uid();arr.push({id,...it})}
  if(isInc&&fd.get("main"))state.mainIncomeId=id;
  if(isInc&&!state.mainIncomeId)state.mainIncomeId=id;
  ui.editBill=ui.editIncome=null;
  commit();flash(editId?"Saved.":`Added ${it.name}.`);
});

function loadSample(){
  const t=today(),fri=addDays(t,(5-t.getDay()+7)%7-7);
  const md=d=>iso(monthDate(t.getFullYear(),t.getMonth(),d));
  const p={id:uid(),name:"Paycheck (example)",amount:1850,freq:"biweekly",date:iso(fri),day2:null};
  state={incomes:[p],mainIncomeId:p.id,paid:{},amounts:{},updatedAt:0,bills:[
    {name:"Rent (example)",amount:1200,freq:"monthly",date:md(1)},
    {name:"Car payment (example)",amount:389,freq:"monthly",date:md(12)},
    {name:"Phone (example)",amount:85,freq:"monthly",date:md(20)},
    {name:"Electric (example)",amount:140,freq:"monthly",date:md(25)},
    {name:"Car insurance (example)",amount:142.5,freq:"monthly",date:md(18)},
    {name:"Groceries (example)",amount:150,freq:"weekly",date:iso(addDays(fri,1))},
    {name:"Streaming (example)",amount:15.99,freq:"monthly",date:md(8)}
  ].map(b=>({id:uid(),day2:null,...b}))};
  commit();flash("Loaded example data. Erase it from the Settings tab when you're ready to add your own.");
}

initStore();
})();
</script>
<script>
if("serviceWorker" in navigator)addEventListener("load",()=>{
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
    // Check for a new version whenever the app comes back to the screen.
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")reg.update().catch(()=>{})});
  }).catch(()=>{});
  // When a new version takes over, reload once so it shows right away.
  let had=!!navigator.serviceWorker.controller,reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!reloaded){reloaded=true;location.reload()}had=true});
});
</script>
